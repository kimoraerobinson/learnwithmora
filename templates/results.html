<!DOCTYPE html>
<html>
<head>
    <title>Results</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="card">
    <img src="/static/logo.png" id="logo">
    <h1>Results</h1>

    <ul>
        {% for topic, s in score.items() %}
        <li>
            {{topic}}: {{s}} / {{total[topic]}}
            ({{ (s/total[topic]*100)|round(0) }}%)
        </li>
        {% endfor %}
    </ul>

    <a href="/restart" class="restart">Restart Quiz</a>
</div>

</body>
</html>
